aid: limofind
name: LimoFind
description: LimoFind is a United States consumer marketplace and quote-request service for ground
  transportation rentals — limousines, party buses, charter buses, sprinter buses, mini buses and
  shuttle buses — connecting travelers with local operators near them. The site runs an instant
  online quote funnel organized by occasion (weddings, proms, airport transfers, corporate travel,
  bachelor and bachelorette parties, birthdays, concerts and sporting events, funerals, wine tasting
  tours, nights out) and by vehicle class, backed by a large set of state and city landing pages
  covering major metropolitan markets across the country. LimoFind is a WordPress-published consumer
  property with a blog covering rental costs and booking guidance; it publishes no public developer
  program, API, SDK or documentation surface.
